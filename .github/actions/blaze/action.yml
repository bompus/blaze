# blaze to build and test blaze with (AGENTS.md rule blaze-builds-blaze): the latest release,
# installed by install.sh into ~/.cargo/bin, and blaze's store, the one cache, pulled from the
# shared remote (.github/actions/blaze-remote) that main's runs push to after their tests. The
# remote's project is the job's, the platform's and the release's: what one release of blaze
# compiled is no use to the next, and a project's manifest only grows, so each release starts
# one of its own.
name: blaze
description: the latest release of blaze, and the store main's runs pushed
inputs:
  job:
    description: the job whose store this is (build, tests)
    required: true
outputs:
  project:
    description: the remote's project of this job's store, for the push after it
    value: ${{ steps.install.outputs.project }}
runs:
  using: composite
  steps:
    - name: blaze (the latest release)
      id: install
      shell: bash
      env:
        JOB: ${{ inputs.job }}
        GH_TOKEN: ${{ github.token }}
      # The toolchain action installed the nightly blaze builds with; when the pin has moved
      # past the release's, blaze fetches its own at the first build.
      run: |
        gh run download 40607485884 -R "$GITHUB_REPOSITORY" -n archive -D "$RUNNER_TEMP/try"
        BLAZE_ARCHIVE=$(ls "$RUNNER_TEMP"/try/*.tar.gz) sh install.sh --no-toolchain --verbose
        said=$(ra-jit --version)
        version=$(echo "$said" | awk '$1 == "blaze" { print $2 }')
        [ -n "$version" ] || { echo "::error::ra-jit --version said no version: $said"; exit 1; }
        echo "RA_JIT_CACHE=$RUNNER_TEMP/blaze-store" >> "$GITHUB_ENV"
        echo "project=blaze-$RUNNER_OS-$RUNNER_ARCH-$JOB-$version" | tee -a "$GITHUB_OUTPUT"
    # A cold store (a new release, or a project main has not pushed yet) builds blaze in about
    # 28 GB, more than a hosted runner's 16 (rcache, #664): swap lets that run finish, slowly,
    # where it would be killed, and the warm runs after it never touch it.
    - name: swap
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # On the disk with the most room: /mnt on x86-64, the root on AArch64, which has no /mnt.
        disk=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -n | tail -n 1 | awk '{ print $2 }')
        swap="${disk%/}/blaze.swap"
        sudo fallocate -l 20G "$swap"
        sudo chmod 600 "$swap"
        sudo mkswap "$swap" > /dev/null
        sudo swapon "$swap"
        free -g
    - uses: ./.github/actions/blaze-remote
      with:
        mode: pull
        project: ${{ steps.install.outputs.project }}
