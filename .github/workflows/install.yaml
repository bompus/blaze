name: install

# lane dejank's macOS probe (branch dejank-macos-probe, never merged): harness/experience.py
# on macos-15 with this commit's build, as a rustup user and as a user with no Rust, and with
# the README's installer.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: "experience.py projects"
        default: "hello derives macapp objcopy oldstable pyo3 sys ripgrep fd bat"

permissions:
  contents: read

jobs:
  readme:
    name: README installer (macos-15)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: python3 harness/experience.py --readme --work "$RUNNER_TEMP/exp-readme" hello macapp || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-readme
          path: ${{ runner.temp }}/exp-readme/*.md

  main:
    name: this commit (macos-15)
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - run: tc=$(cat harness/toolchain) && rustup toolchain install "$tc" --profile minimal --component rust-src --component llvm-tools && rustup default "$tc"
      - run: brew install pkg-config openssl@3 || true
      - run: python3 .github/scripts/build_release.py --target aarch64-apple-darwin --out shipped --server
      - name: archive
        run: |
          name=blaze-commit-aarch64-apple-darwin
          mkdir "$name" && cp shipped/* "$name/" && "$name/blaze" --version
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: archive-macos
          path: blaze-commit-aarch64-apple-darwin.tar.gz
      - name: experience, a rustup user
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig
        run: python3 harness/experience.py --install blaze-commit-aarch64-apple-darwin.tar.gz --rustup --work "$RUNNER_TEMP/exp-rustup" ${{ inputs.projects }} || true
      - name: experience, no Rust
        run: |
          # No rustup or cargo on PATH: blaze brings its own.
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -e '\.cargo/bin' -e rustup | paste -sd: -)
          python3 harness/experience.py --install blaze-commit-aarch64-apple-darwin.tar.gz --work "$RUNNER_TEMP/exp-norust" hello derives macapp pyo3 sys || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-main
          path: |
            ${{ runner.temp }}/exp-rustup/*.md
            ${{ runner.temp }}/exp-rustup/*.json
            ${{ runner.temp }}/exp-rustup/install.txt
            ${{ runner.temp }}/exp-norust/*.md
            ${{ runner.temp }}/exp-norust/*.json
            ${{ runner.temp }}/exp-norust/install.txt
